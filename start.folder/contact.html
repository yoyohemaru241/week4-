<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header>
    <h1>お問い合わせ</h1>
    <nav>
        <ul class="nav-list">
            <li><a href="../index.html">ホーム</a></li>
            <li><a href="contact.html">お問い合わせ</a></li>
            <li><a href="work.html">課題</a></li>
            <li><a href="calculate.html">電卓</a></li>
        </ul>
    </nav>
    </header>
    <main>
        <section class="contact-form">
            <form action="#" method="post">
                <label for="name">名前:</label>
                <input type="text" name="name" id="name" required>

                <label for="email">メールアドレス</label>
                <input type="email" name="email" id="email" required>

                <label for="purpose">目的</label>
                <select name="choice" id="choice">
                    <option value="not_select">未選択</option>
                    <option value="recruitment">リクルート</option>
                    <option value="question">質問</option>
                    <option value="job_request">仕事依頼</option>
                
                </select>

                <label for="message">メッセージ</label>
                <textarea name="message" id="message" rows="7" required>

                </textarea>
                <button type="submit">送信</button>
            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 私のポートフォリオ </p>
    </footer>
</body>
</html>
